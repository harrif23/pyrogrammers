[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flground"
version = "0.1.0"
description = "Model-agnostic screenshot grounding harness for FL Studio"
requires-python = ">=3.11"
dependencies = ["openai>=1.50,<3", "python-dotenv>=1,<2", "pillow>=10,<13", "pydantic>=2,<3", "typer>=0.12,<1", "huggingface_hub>=0.25,<2"]

[project.optional-dependencies]
desktop = ["mss>=9,<11", "pyautogui>=0.9.54,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
flground = "flground.cli:app"
evals = "evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flground", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
