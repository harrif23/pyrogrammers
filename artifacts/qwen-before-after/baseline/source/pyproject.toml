[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flground"
version = "0.1.0"
description = "Model-agnostic screenshot grounding harness for FL Studio"
requires-python = ">=3.11"
dependencies = ["openai>=1.50,<3", "python-dotenv>=1,<2", "pillow>=10,<13", "pydantic>=2,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
desktop = ["mss>=9,<11", "pyautogui>=0.9.54,<1", "pyobjc-framework-Cocoa>=10,<14; sys_platform == 'darwin'"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
flground = "flground.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
